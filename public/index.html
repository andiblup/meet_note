        <div id="rooms-select" class="select">
            <button id="rooms-trigger" type="button" class="btn-outline justify-between font-normal w-[360px]"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="rooms-listbox">
                <span class="truncate" id="rooms-label">default</span>
                <!-- dein Chevron-Icon ... -->
            </button>

            <div id="rooms-popover" data-popover aria-hidden="true" class="w-[360px]">
                <!-- Header 1: Suchen -->
                <header class="flex justify-start">
                    <!-- (dein Search-Icon) -->
                    <input type="text" id="rooms-search" placeholder="Search rooms…" autocomplete="off" />
                </header>

                <!-- Header 2: Erstellen -->
                <form id="rooms-create-form" class="flex justify-start items-center mt-2">
                    <button type="submit" id="room-create-btn" aria-label="Create new room" class="cursor-pointer">
                        <!-- (dein file-plus Icon) -->
                    </button>
                    <input type="text" id="room-create-input" placeholder="Create new room" autocomplete="off"
                        class="flex-1 bg-transparent border-none outline-none" />
                </form>

                <!-- Liste -->
                <div role="listbox" id="rooms-listbox" aria-orientation="vertical" aria-labelledby="rooms-trigger">
                    <div role="group" aria-labelledby="rooms-group-heading">
                        <div role="heading" id="rooms-group-heading">Rooms</div>

                        <!-- Aktueller (wird per JS befüllt) -->
                        <div id="rooms-current" role="option" data-value="" aria-selected="true">default</div>

                        <!-- Dynamische Treffer werden davor eingefügt -->
                        <div id="rooms-dynamic-anchor" aria-hidden="true" style="height:0;"></div>
                    </div>
                </div>
            </div>

            <input type="hidden" name="rooms-value" value="default" />
        </div>


        <div class="ml-auto flex items-center gap-2">

            <div id="select-445592" class="select">
                <button type="button" class="btn-outline justify-between font-normal w-[180px]"
                    id="select-445592-trigger" aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="select-445592-listbox">
                    <span class="truncate">Default</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-chevrons-up-down-icon lucide-chevrons-up-down text-muted-foreground opacity-50 shrink-0">
                        <path d="m7 15 5 5 5-5" />
                        <path d="m7 9 5-5 5 5" />
                    </svg>
                </button>

                <div id="select-445592-popover" data-popover aria-hidden="true" class="w-[180px]">
                    <header>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-search-icon lucide-search">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <input type="text" value="" placeholder="Search themes..." autocomplete="off" autocorrect="off"
                            spellcheck="false" aria-autocomplete="list" role="combobox" aria-expanded="false"
                            aria-controls="select-445592-listbox" aria-labelledby="select-445592-trigger" />
                    </header>

                    <div role="listbox" id="select-445592-listbox" aria-orientation="vertical"
                        aria-labelledby="select-445592-trigger">
                        <div role="group" aria-labelledby="group-label-select-445592-items-1">
                            <div role="heading" id="group-label-select-445592-items-1">Theme family</div>

                            <!-- Default -->
                            <div id="select-445592-items-1-1" role="option" data-value="default" aria-selected="true"
                                onclick="document.dispatchEvent(new CustomEvent('basecoat:brand',{detail:{brand:'default'}}));">
                                Default
                            </div>

                            <!-- Purple -->
                            <div id="select-445592-items-1-2" role="option" data-value="purple"
                                onclick="document.dispatchEvent(new CustomEvent('basecoat:brand',{detail:{brand:'purple'}}));">
                                Purple
                            </div>
                        </div>
                    </div>
                </div>

                <input type="hidden" name="select-445592-value" value="default" />
            </div>

        </div>

            <input type="hidden" name="select-445592-value" value="" />

    <button class="btn" id="add-note">Neue Notiz</button>
    <script>
        document.getElementById('add-note').addEventListener('click', () => {
            const id = 'note-' + Date.now().toString(36).slice(-6);
            NotesUI.addNote(id, 'Notiz ' + id);
        });
    </script>
