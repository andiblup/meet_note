    <header class="bg-white shadow p-3 flex items-center gap-2">
        <h1 class="text-xl font-semibold">MeetNote</h1>
        <div class="ml-auto flex items-center gap-2">
            <input id="room" class="bc-input w-40" placeholder="Room ID" />
            <button id="join" class="bc-btn bc-btn-primary">Join</button>
        </div>
    </header>

    <main class="p-4 max-w-6xl mx-auto">
        <!-- Gemeinsame Toolbar (einmalig, wird für alle Editoren benutzt) -->
        <div id="toolbar" class="mb-3">
            <span class="ql-formats">
                <select class="ql-header"></select>
                <select class="ql-font"></select>
            </span>
            <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
                <button class="ql-underline"></button>
                <button class="ql-strike"></button>
            </span>
            <span class="ql-formats">
                <select class="ql-color"></select>
                <select class="ql-background"></select>
            </span>
            <span class="ql-formats">
                <button class="ql-list" value="ordered"></button>
                <button class="ql-list" value="bullet"></button>
                <select class="ql-align"></select>
            </span>
            <span class="ql-formats">
                <button class="ql-link"></button>
                <button class="ql-blockquote"></button>
                <button class="ql-code-block"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-clean"></button>
            </span>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
            <div class="card p-2 bg-white">
                <h3 class="mb-2 font-medium">Notiz A</h3>
                <div class="editor" data-note-id="noteA"></div>
            </div>
            <div class="card p-2 bg-white">
                <h3 class="mb-2 font-medium">Notiz B</h3>
                <div class="editor" data-note-id="noteB"></div>
            </div>
        </div>

        <p class="text-xs text-gray-500 mt-3" id="status">Verbunden…</p>
    </main>











    <!-- Socket.IO Client (lokal vom Server) -->
