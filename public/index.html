    <header class="bg-white dark:bg-transparent shadow p-3 flex items-center gap-3"
        style="background:var(--card);color:var(--fg);">
        <h1 class="text-xl font-semibold">MeetNote</h1>

        <div class="ml-auto flex items-center gap-2">

            <div id="select-445592" class="select">
                <button type="button" class="btn-outline justify-between font-normal w-[180px]"
                    id="select-445592-trigger" aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="select-445592-listbox">
                    <span class="truncate">Default</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-chevrons-up-down-icon lucide-chevrons-up-down text-muted-foreground opacity-50 shrink-0">
                        <path d="m7 15 5 5 5-5" />
                        <path d="m7 9 5-5 5 5" />
                    </svg>
                </button>

                <div id="select-445592-popover" data-popover aria-hidden="true" class="w-[180px]">
                    <header>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-search-icon lucide-search">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <input type="text" value="" placeholder="Search entries..." autocomplete="off" autocorrect="off"
                            spellcheck="false" aria-autocomplete="list" role="combobox" aria-expanded="false"
                            aria-controls="select-445592-listbox" aria-labelledby="select-445592-trigger" />
                    </header>

                    <div role="listbox" id="select-445592-listbox" aria-orientation="vertical"
                        aria-labelledby="select-445592-trigger">
                        <div role="group" aria-labelledby="group-label-select-445592-items-1">
                            <div role="heading" id="group-label-select-445592-items-1">Theme family</div>

                            <!-- Default -->
                            <div id="select-445592-items-1-1" role="option" data-value="default" aria-selected="true"
                                onclick="document.dispatchEvent(new CustomEvent('basecoat:brand',{detail:{brand:'default'}}));">
                                Default
                            </div>

                            <!-- Purple -->
                            <div id="select-445592-items-1-2" role="option" data-value="purple"
                                onclick="document.dispatchEvent(new CustomEvent('basecoat:brand',{detail:{brand:'purple'}}));">
                                Purple
                            </div>
                        </div>
                    </div>
                </div>

                <input type="hidden" name="select-445592-value" value="default" />
            </div>

        </div>


        <!-- <button type="button" aria-label="Toggle dark mode" data-tooltip="Toggle dark mode" data-side="bottom"

        <button type="button" aria-label="Toggle dark mode" data-tooltip="Toggle dark mode" data-side="bottom"
            onclick="document.dispatchEvent(new CustomEvent('basecoat:theme'))" class="btn-icon-outline size-8"
            id="theme-toggle-btn">
            <span class="sr-only">Toggle dark mode</span>

            <!-- NEU: überlagerte Icons -->
            <span class="tt-wrap" aria-hidden="true">
                <iconify-icon class="tt-icon tt-sun" width="60%" height="60%" icon="mdi:weather-sunny"></iconify-icon>
                <iconify-icon class="tt-icon tt-moon" width="60%" height="60%" icon="mdi:weather-night"></iconify-icon>
            </span>
        </button>




        <!--  -->

        <div id="select-445592" class="select">
            <button type="button" class="btn-outline justify-between font-normal w-[360px]" id="select-445592-trigger"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="select-445592-listbox">

                <iconify-icon icon="mdi:antenna"></iconify-icon>
                <span class="truncate" id="select-445592-label">—</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide text-muted-foreground opacity-50 shrink-0">
                    <path d="m7 15 5 5 5-5" />
                    <path d="m7 9 5-5 5 5" />
                </svg>
                <!-- <iconify-icon icon="mdi:lan-connect"></iconify-icon> -->
            </button>

            <div id="select-445592-popover" data-popover aria-hidden="true" class="w-[360px]">
                <header>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-search-icon lucide-search">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    <input type="text" value="" placeholder="Scanning LAN…" autocomplete="off" autocorrect="off"
                        spellcheck="false" aria-autocomplete="list" role="combobox" aria-expanded="false"
                        aria-controls="select-445592-listbox" aria-labelledby="select-445592-trigger" disabled />
                </header>

                <div role="listbox" id="select-445592-listbox" aria-orientation="vertical"
                    aria-labelledby="select-445592-trigger">
                    <div role="group" aria-labelledby="group-label-select-445592-items-1">
                        <div role="heading" id="group-label-select-445592-items-1">Connections</div>

                        <!-- Aktuelle Verbindung (wird per JS befüllt & ausgewählt) -->
                        <div id="select-445592-current" role="option" data-value="" aria-selected="true">—</div>

                        <!-- Dynamische Treffer werden davor eingefügt -->
                        <div id="select-445592-dynamic-anchor" aria-hidden="true" style="height:0;"></div>

                    </div>
                </div>
            </div>

            <input type="hidden" name="select-445592-value" value="" />
        </div>

    </header>

    <main id="main" class="flex-1 p-4 max-w-6xl mx-auto overflow-y-auto">

            </span>
            <span class="ql-formats">

                <button class="ql-code-block"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-clean"></button>
            </span>
        </div>

        <div id="notes" class="notes">

            <div class="note note--me" data-note-id="noteA" data-owner="">
                <div class="card p-2 bg-white">
                    <h3 class="mb-2 font-medium">Notiz A</h3>
                    <div class="editor" data-note-id="noteA"></div>
                </div>
            </div>

            <div class="note note--other" data-note-id="noteB" data-owner="">
                <div class="card p-2 bg-white">
                    <h3 class="mb-2 font-medium">Notiz B</h3>
                    <div class="editor" data-note-id="noteB"></div>
                </div>
            </div>
        </div>
