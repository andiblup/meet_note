<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./styles/output.css" rel="stylesheet">
    <link href="./styles/styles.css" rel="stylesheet">
    <!-- <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script> -->
    <!-- <link href="./node_modules/boxicons/fonts/boxicons.ttf" rel="stylesheet"> -->
    <!-- <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> -->
</head>

<body>
    <h1 class="text-3xl font-bold underline bg-red-600">
        Hello world!
    </h1>
    <p class="text-lg text-red-700">
        This is a sample paragraph to demonstrate Tailwind CSS styling.
    </p>
    <p class="bg-green-600">
        <iconify-icon icon="mdi:note-edit" class="w-4 h-4"></iconify-icon>
        <iconify-icon icon="mdi:account" class="w-4 h-4"></iconify-icon>
        <iconify-icon icon="mdi:account-outline" class="w-4 h-4"></iconify-icon>
    </p>

    <div class="card w-full">
        <header>
            <h2>Login to your account</h2>
            <p>Enter your details below to login to your account</p>
        </header>
        <section>
            <form class="form grid gap-6">
                <div class="grid gap-2">
                    <label for="demo-card-form-email">Email</label>
                    <input type="email" id="demo-card-form-email">
                </div>
                <div class="grid gap-2">
                    <div class="flex items-center gap-2">
                        <label for="demo-card-form-password">Password</label>
                        <a href="#" class="ml-auto inline-block text-sm underline-offset-4 hover:underline">Forgot your
                            password?</a>
                    </div>
                    <input type="password" id="demo-card-form-password">
                </div>
            </form>
        </section>
        <footer class="flex flex-col items-center gap-2">
            <button type="button" class="btn w-full">Login</button>
            <button type="button" class="btn-outline w-full">Login with Google</button>
            <p class="mt-4 text-center text-sm">Don't have an account? <a href="#"
                    class="underline-offset-4 hover:underline">Sign up</a></p>
        </footer>
    </div>
</body>

<script>
    import mdiData from '@iconify/json/json/mdi.json';
    addCollection(mdiData);
    iconifyRender();
</script>
<script src="/js/basecoat/basecoat.min.js" defer></script>
<script src="/js/basecoat/tabs.min.js" defer></script>
<script src="/js/iconify-icon.min.js"></script>
</html>
